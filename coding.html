<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="Java Battles - A coding battle game where you write Java code to control your character and defeat opponents.">
  <meta name="author" content="Kaden Cruts">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Java Battles</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      height: 100vh;
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
    }

    /* Code Input Area - Left Side */
    #codeInput {
      width: 33%;
      background-color: #2d2d2d;
      color: #fff;
      padding: 20px;
      border-right: 3px solid #28a745;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #codeInput > div {
      margin-bottom: 15px;
    }

    #codeInput h2 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #28a745;
    }

    #runCodeButton {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #28a745;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    #runCodeButton:hover {
      background-color: #218838;
    }

    #codeArea {
      flex: 1;
      background-color: #1a1a1a;
      color: #d4d4d4;
      border: 2px solid #28a745;
      border-radius: 5px;
      padding: 15px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      outline: none;
      line-height: 1.5;
    }

    #codeArea:empty:before {
      content: attr(data-placeholder);
      color: #666;
    }


    /* Syntax highlighting colors */
    .keyword {
      color: #569cd6;
      font-weight: bold;
    }

    .function {
      color: #dcdcaa;
    }

    .string {
      color: #ce9178;
    }

    .comment {
      color: #6a9955;
      font-style: italic;
    }

    .number {
      color: #b5cea8;
    }

    .operator {
      color: #d4d4d4;
    }

    .type {
      color: #4ec9b0;
    }

    #codeArea::placeholder {
      color: #666;
    }


    /* Console Output Area */
    #consoleOutput {
      background-color: #1a1a1a;
      color: #00ff00;
      border: 2px solid #28a745;
      border-radius: 5px;
      padding: 15px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      max-height: 150px;
      overflow-y: auto;
      margin-top: 10px;
    }

    #consoleOutput h3 {
      color: #28a745;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .console-line {
      margin: 2px 0;
      color: #00ff00;
    }

    .console-error {
      color: #ff6b6b;
    }

    .console-info {
      color: #4dabf7;
    }

    /* Game Area - Center */
    #gameArea {
      width: 34%;
      display: flex;
      flex-direction: column;
      background-color: #0d0d0d;
      border-right: 3px solid #ff6b6b;
    }

    /* Enemy Section - Top */
    #enemySection {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      border-bottom: 3px solid #28a745;
      justify-content: flex-start;
    }

    #enemyHPContainer {
      margin-bottom: 20px;
    }

    #enemyHPContainer h3 {
      color: #ff6b6b;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .hpBar {
      width: 100%;
      height: 30px;
      background-color: #333;
      border: 2px solid #666;
      border-radius: 5px;
      overflow: hidden;
    }

    .hpFill {
      height: 100%;
      background: linear-gradient(90deg, #28a745, #20c997);
      width: 100%;
      transition: width 0.3s ease;
    }

    #enemySection .hpFill {
      background: linear-gradient(90deg, #ff6b6b, #ff8787);
    }

    #enemyPositions {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex: 1;
      align-items: center;
    }

    /* Player Section - Bottom */
    #playerSection {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      justify-content: flex-end;
    }

    #playerHPContainer {
      margin-bottom: 20px;
    }

    #playerHPContainer h3 {
      color: #4dabf7;
      font-size: 18px;
      margin-bottom: 8px;
    }

    #playerSection .hpFill {
      background: linear-gradient(90deg, #4dabf7, #74c0fc);
    }

    #playerPositions {
      display: flex;
      justify-content: center;
      gap: 30px;
      align-items: flex-end;
      height: auto;
    }

    /* Position Slots */
    .positions {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .slot {
      width: 100px;
      height: 100px;
      background-color: #1a1a1a;
      border: 3px solid #28a745;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      color: #28a745;
      cursor: pointer;
      transition: all 0.3s;
    }

    .slot:hover {
      background-color: #2d2d2d;
      box-shadow: 0 0 15px rgba(40, 167, 69, 0.5);
    }

    #enemyPositions .slot {
      border-color: #ff6b6b;
      color: #ff6b6b;
    }

    #enemyPositions .slot:hover {
      box-shadow: 0 0 15px rgba(255, 107, 107, 0.5);
    }

    #playerPositions .slot {
      border-color: #4dabf7;
      color: #4dabf7;
    }

    #playerPositions .slot:hover {
      background-color: #2d2d2d;
      box-shadow: 0 0 15px rgba(77, 171, 247, 0.5);
    }

    /* Scrollbar Styling */
    #codeArea::-webkit-scrollbar {
      width: 8px;
    }

    #codeArea::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    #codeArea::-webkit-scrollbar-thumb {
      background: #28a745;
      border-radius: 4px;
    }

    #codeArea::-webkit-scrollbar-thumb:hover {
      background: #218838;
    }

    /* Enemy Code Area - Right Side */
    #enemyCode {
      width: 33%;
      background-color: #2d2d2d;
      color: #fff;
      padding: 20px;
      border-left: 3px solid #ff6b6b;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #enemyCode > div {
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #enemyCode h2 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #ff6b6b;
    }

    #enemyCodeArea {
      flex: 1;
      background-color: #1a1a1a;
      color: #ff6b6b;
      border: 2px solid #ff6b6b;
      border-radius: 5px;
      padding: 15px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      resize: none;
      overflow-y: auto;
      cursor: not-allowed;
    }

    #enemyCodeArea::placeholder {
      color: #666;
    }

    #enemyCodeArea::-webkit-scrollbar {
      width: 8px;
    }

    #enemyCodeArea::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    #enemyCodeArea::-webkit-scrollbar-thumb {
      background: #ff6b6b;
      border-radius: 4px;
    }

    #enemyCodeArea::-webkit-scrollbar-thumb:hover {
      background: #ff5252;
    }

    #exitButton {
      padding: 8px 16px;
      font-size: 14px;
      background-color: #ff6b6b;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
      align-self: flex-start;
    }

    #exitButton:hover {
      background-color: #ff5252;
    }
  </style>
  <script>
    // Supported functions and operations
    const ALLOWED_FUNCTIONS = ['moveLeft', 'moveRight', 'attack', 'defend', 'heal', 'attackEnemySlotOne', 'attackEnemySlotTwo', 'attackEnemySlotThree'];
    const JAVA_KEYWORDS = ['if', 'else', 'for', 'while', 'class', 'public', 'private', 'void', 'int', 'return', 'break', 'continue', 'do'];

    // Loop safety limits
    const MAX_ITERATIONS_PER_LOOP = 200; // hard cap per loop
    const TOTAL_LOOP_BUDGET = 500;       // shared budget across all loops per run

    // Game state
    let gameState = {
      playerHP: 100,
      enemyHP: 100,
      playerPosition: 2, // 1, 2, or 3
      enemyPosition: 2,
      defending: false,
      enemyDefending: false,
      console: [],
      complexityScore: 0,
      enemyComplexityScore: 0,
      playerChargeStack: 0,
      enemyChargeStack: 0,
      playerComboCount: 0,
      enemyComboCount: 0,
      playerExpectedCombo: 1,
      enemyExpectedCombo: 1,
      playerStealthed: false,
      enemyStealthed: false,
      playerStealthInstances: 0,
      enemyStealthInstances: 0,
      playerCritBoostActive: false,
      enemyCritBoostActive: false,
      playerCritBoostCount: 0,
      enemyCritBoostCount: 0,
      playerBarrier: 0,
      enemyBarrier: 0,
      playerPoisoned: false,
      enemyPoisoned: false,
      playerPoisonTurns: 0,
      enemyPoisonTurns: 0,
      executionPaused: false
    };

    // Function cooldowns in milliseconds
    const COOLDOWNS = {
      moveLeft: 500,
      moveRight: 500,
      attack: 1000,
      defend: 800,
      heal: 1500,
      attackEnemySlotOne: 1000,
      attackEnemySlotTwo: 1000,
      attackEnemySlotThree: 1000,
      qa1: 800,
      qa2: 800,
      qa3: 800,
      qml: 400,
      qmr: 400,
      charge: 700,
      release: 10000,
      teleportTo: 1200,
      scan: 600,
      combo: 1200,
      stealth: 2000,
      backstab: 3000,
      gamble: 1500,
      critBoost: 2000,
      barrier: 1800,
      shieldBash: 2500,
      poison: 2000,
      cure: 1000
    };

    // Track who is executing: 'player' or 'enemy'
    let currentActor = 'player';

    // Remaining loop iteration budget for the current run
    let loopIterationBudget = TOTAL_LOOP_BUDGET;

    // Variable storage for code execution with scoping
    let variableScopes = [{}]; // Stack of scopes
    let breakFlag = false;
    let continueFlag = false;
    
    // Helper for variable access with scope chain
    function getVariable(name) {
      for (let i = variableScopes.length - 1; i >= 0; i--) {
        if (variableScopes[i].hasOwnProperty(name)) {
          return variableScopes[i][name];
        }
      }
      return undefined;
    }
    
    function setVariable(name, value, declare = false) {
      if (declare) {
        variableScopes[variableScopes.length - 1][name] = value;
      } else {
        // Find the variable in scope chain and update it
        for (let i = variableScopes.length - 1; i >= 0; i--) {
          if (variableScopes[i].hasOwnProperty(name)) {
            variableScopes[i][name] = value;
            return;
          }
        }
        // If not found, create in current scope
        variableScopes[variableScopes.length - 1][name] = value;
      }
    }
    
    function pushScope() {
      variableScopes.push({});
    }
    
    function popScope() {
      if (variableScopes.length > 1) {
        variableScopes.pop();
      }
    }

    // Wait for DOM to load before attaching event listeners
    document.addEventListener('DOMContentLoaded', () => {
      const codeArea = document.getElementById('codeArea');
      
      // Initialize syntax highlighting (using global preventHighlighting flag)
      codeArea.addEventListener('input', () => {
        if (!preventHighlighting) {
          applySyntaxHighlighting();
        }
      });
      
      codeArea.addEventListener('keydown', (e) => {
        // Handle tab key
        if (e.key === 'Tab') {
          e.preventDefault();
          document.execCommand('insertText', false, '  ');
          return false;
        }
        
        // Handle enter key - insert <br> and position cursor
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();

          // Get caret index counting <br> as newline
          const caretBefore = getCaretIndex(codeArea);
          console.log('[Enter] caret before:', caretBefore);

          // Insert <br> at current selection
          const selection = window.getSelection();
          if (selection.rangeCount === 0) return false;
          const range = selection.getRangeAt(0);
          const br = document.createElement('br');
          range.insertNode(br);

          // Move caret to the position immediately after the inserted <br>
          const targetIndex = caretBefore + 1;
          setCaretByIndex(codeArea, targetIndex);

          const caretAfter = getCaretIndex(codeArea);
          console.log('[Enter] caret after:', caretAfter, 'length:', codeArea.innerText.length);
          
          // Trigger syntax highlighting
          setTimeout(() => {
            console.log('[Enter] applySyntaxHighlighting call');
            applySyntaxHighlighting();
          }, 10);
          
          return false;
        }
      });

      // Exit button functionality
      document.getElementById('exitButton').addEventListener('click', () => {
        window.location.href = 'index.html';
      });

      // Start battle: enemy AI typing simulation
      const startBtn = document.getElementById('startBattleButton');
      const enemyArea = document.getElementById('enemyCodeArea');
      let enemyBattleInProgress = false;

      function typeTextSlowly(targetEl, text, charDelay = 80, onDone, append = false) {
        if (!append) {
          targetEl.value = '';
        } else {
          if (targetEl.value && !targetEl.value.endsWith('\n')) {
            targetEl.value += '\n';
          }
        }
        let i = 0;
        const timer = setInterval(() => {
          targetEl.value += text[i];
          targetEl.scrollTop = targetEl.scrollHeight;
          i++;
          if (i >= text.length) {
            clearInterval(timer);
            if (onDone) onDone();
          }
        }, charDelay);
      }

      function runEnemyTurn() {
        if (gameState.enemyHP <= 0 || gameState.playerHP <= 0) {
          // Battle over
          enemyBattleInProgress = false;
          startBtn.disabled = false;
          consoleLog('Battle ended.', 'info');
          displayConsole();
          return;
        }

        const aiCode = generateEnemyCode();
        typeTextSlowly(enemyArea, aiCode, 60, () => {
          executeEnemyJavaCode(aiCode);
          // Queue next turn if battle continues
          if (gameState.enemyHP > 0 && gameState.playerHP > 0) {
            setTimeout(runEnemyTurn, 2500);
          } else {
            enemyBattleInProgress = false;
            startBtn.disabled = false;
          }
        }, true);
      }

      startBtn.addEventListener('click', () => {
        if (enemyBattleInProgress) return;
        enemyBattleInProgress = true;
        startBtn.disabled = true;
        enemyArea.value = '';
        consoleLog('Enemy is preparing strategies...', 'info');
        displayConsole();
        runEnemyTurn();
      });

      // Code validation and execution
      document.getElementById('runCodeButton').addEventListener('click', () => {
        const code = getCodeText();
        
        if (!code) {
          alert('Please enter some code first!');
          return;
        }

        try {
          // Validate Java syntax
          validateJavaCode(code);
          
          // Parse and execute supported operations
          executeJavaCode(code);
          
          // Clear the code area after successful execution
          document.getElementById('codeArea').innerHTML = '';
        } catch (error) {
          alert('Error: ' + error.message);
          consoleLog('Error: ' + error.message, 'error');
          displayConsole();
        }
      });
    });

    function getCodeText() {
      const codeArea = document.getElementById('codeArea');
      
      // Clone the element to avoid modifying the original
      const clone = codeArea.cloneNode(true);
      
      // Replace all <br> tags with newlines
      const brs = clone.querySelectorAll('br');
      brs.forEach(br => {
        br.replaceWith('\n');
      });
      
      // Replace <div> with newlines (some browsers use divs for line breaks)
      const divs = clone.querySelectorAll('div');
      divs.forEach(div => {
        div.before('\n');
      });
      
      // Get the text content
      let text = clone.textContent || clone.innerText || '';
      
      // Clean up any excessive whitespace but preserve intentional line breaks
      return text.trim();
    }

    // Flag to prevent recursive syntax highlighting calls
    let isHighlighting = false;
    // Flag to prevent input event from triggering syntax highlighting
    let preventHighlighting = false;

    // Return caret index counting <br> as a single newline character
    function getCaretIndex(rootEl) {
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0) return 0;

      const range = selection.getRangeAt(0).cloneRange();
      const markerChar = '\uE000';
      const marker = document.createTextNode(markerChar);
      range.insertNode(marker);

      const clone = rootEl.cloneNode(true);
      clone.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
      const text = clone.textContent || '';
      const index = text.indexOf(markerChar);

      marker.parentNode.removeChild(marker);
      return Math.max(0, index);
    }

    function setCaretByIndex(rootEl, index) {
      const selection = window.getSelection();
      const range = document.createRange();
      let current = 0;
      let found = false;

      function walk(node) {
        if (found) return;

        if (node.nodeType === Node.TEXT_NODE) {
          const next = current + node.textContent.length;
          if (index <= next) {
            range.setStart(node, Math.max(0, index - current));
            found = true;
            return;
          }
          current = next;
          return;
        }

        if (node.nodeType === Node.ELEMENT_NODE && node.tagName === 'BR') {
          const next = current + 1; // count newline for <br>
          if (index <= next) {
            range.setStartAfter(node);
            found = true;
            return;
          }
          current = next;
        }

        let child = node.firstChild;
        while (child && !found) {
          walk(child);
          child = child.nextSibling;
        }
      }

      walk(rootEl);

      if (!found) {
        range.selectNodeContents(rootEl);
        range.collapse(false);
      }

      range.collapse(true);
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function applySyntaxHighlighting() {
      if (isHighlighting) {
        return;
      }
      
      isHighlighting = true;
      preventHighlighting = true;
      const codeArea = document.getElementById('codeArea');

      // Capture caret index (counts <br> as newline)
      const caretIndex = getCaretIndex(codeArea);

      // Clone and convert <br> tags to newlines to preserve structure
      const clone = codeArea.cloneNode(true);
      clone.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
      
      // Get text content with line breaks preserved
      const code = clone.textContent || '';
      
      if (!code) {
        codeArea.innerHTML = '';
        isHighlighting = false;
        preventHighlighting = false;
        return;
      }
      
      const highlighted = highlightJavaCode(code);
      codeArea.innerHTML = highlighted;
      
      // Restore caret position if we captured it
      setCaretByIndex(codeArea, caretIndex);
      
      isHighlighting = false;
      
      // Re-enable input event listener after a short delay
      setTimeout(() => {
        preventHighlighting = false;
      }, 20);
    }

    function highlightJavaCode(code) {
      const lines = code.split('\n');
      const highlightedLines = [];
      
      for (let line of lines) {
        // Empty lines should just be empty, not <br>
        if (!line) {
          highlightedLines.push('');
          continue;
        }
        
        // Highlight comments first
        if (line.trim().startsWith('//')) {
          let highlighted = '<span class="comment">' + safeEscape(line) + '</span>';
          highlightedLines.push(highlighted);
          continue;
        }
        
        // Escape special characters first
        let highlighted = safeEscape(line);
        
        // Create an array to track what's been highlighted
        // We'll use a placeholder system to prevent double-highlighting
        const tokens = [];
        let tokenId = 0;
        
        // Highlight strings first (highest priority)
        highlighted = highlighted.replace(/&quot;([^&quot;]*)&quot;/g, function(match, p1) {
          const token = `__TOKEN_${tokenId}__`;
          tokens.push({ token, html: '<span class="string">&quot;' + p1 + '&quot;</span>' });
          tokenId++;
          return token;
        });
        
        // Highlight types
        highlighted = highlighted.replace(/\b(int|String|boolean|double|float|void|long|short|byte|char)\b/g, function(match) {
          const token = `__TOKEN_${tokenId}__`;
          tokens.push({ token, html: '<span class="type">' + match + '</span>' });
          tokenId++;
          return token;
        });
        
        // Highlight keywords
        highlighted = highlighted.replace(/\b(if|else|for|while|do|return|public|private|class|break|continue|new|true|false|null)\b/g, function(match) {
          const token = `__TOKEN_${tokenId}__`;
          tokens.push({ token, html: '<span class="keyword">' + match + '</span>' });
          tokenId++;
          return token;
        });
        
        // Highlight function calls
        highlighted = highlighted.replace(/\b(moveLeft|moveRight|attack|defend|heal|attackEnemySlotOne|attackEnemySlotTwo|attackEnemySlotThree|println|qa1|qa2|qa3|qml|qmr|charge|release|teleportTo|scan|combo|stealth|backstab|gamble|critBoost|barrier|shieldBash|poison|cure)\b/g, function(match) {
          const token = `__TOKEN_${tokenId}__`;
          tokens.push({ token, html: '<span class="function">' + match + '</span>' });
          tokenId++;
          return token;
        });
        
        // Highlight numbers
        highlighted = highlighted.replace(/\b(\d+)\b/g, function(match) {
          const token = `__TOKEN_${tokenId}__`;
          tokens.push({ token, html: '<span class="number">' + match + '</span>' });
          tokenId++;
          return token;
        });
        
        // Highlight operators
        highlighted = highlighted.replace(/(\+\+|--|&lt;=|&gt;=|==|!=|&amp;&amp;|\|\||&lt;|&gt;|\+=|-=|\*=|\/=|%=)/g, function(match) {
          const token = `__TOKEN_${tokenId}__`;
          tokens.push({ token, html: '<span class="operator">' + match + '</span>' });
          tokenId++;
          return token;
        });
        
        // Replace all tokens with their HTML
        tokens.forEach(item => {
          highlighted = highlighted.replace(item.token, item.html);
        });
        
        highlightedLines.push(highlighted);
      }
      
      // Join lines with <br>
      let result = '';
      for (let i = 0; i < highlightedLines.length; i++) {
        result += highlightedLines[i]; // Don't add &nbsp; for empty lines - keep them truly empty
        if (i < highlightedLines.length - 1) {
          result += '<br>';
        }
      }
      return result;
    }

    function safeEscape(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/  /g, '&nbsp;&nbsp;');
    }

    function saveCursorPosition(element) {
      const selection = window.getSelection();
      if (selection.rangeCount === 0) return 0;
      
      const range = selection.getRangeAt(0);
      const preCaretRange = range.cloneRange();
      preCaretRange.selectNodeContents(element);
      preCaretRange.setEnd(range.endContainer, range.endOffset);
      
      return preCaretRange.toString().length;
    }

    function restoreCursorPosition(element, position) {
      const selection = window.getSelection();
      const range = document.createRange();
      
      let charCount = 0;
      let nodeStack = [element];
      let node, foundNode, foundOffset;
      
      while (node = nodeStack.pop()) {
        if (node.nodeType === 3) {
          const nextCharCount = charCount + node.length;
          if (!foundNode && position >= charCount && position <= nextCharCount) {
            foundNode = node;
            foundOffset = position - charCount;
          }
          charCount = nextCharCount;
        } else {
          let i = node.childNodes.length;
          while (i--) {
            nodeStack.push(node.childNodes[i]);
          }
        }
      }
      
      if (foundNode) {
        range.setStart(foundNode, foundOffset);
        range.collapse(true);
        selection.removeAllRanges();
        selection.addRange(range);
      }
    }

    function validateJavaCode(code) {
      const lines = code.split('\n');
      let openedBraces = 0;
      let openedParens = 0;
      let inString = false;
      let stringChar = '';
      let inComment = false;

      // Check for damage/heal functions inside loops
      checkForForbiddenFunctionsInLoops(lines);

      for (let line of lines) {
        const trimmedLine = line.trim();
        
        // Skip empty lines
        if (!trimmedLine) continue;

        // Handle line comments
        if (trimmedLine.startsWith('//')) continue;

        // Handle block comments
        if (trimmedLine.includes('/*')) inComment = true;
        if (trimmedLine.includes('*/')) {
          inComment = false;
          continue;
        }
        if (inComment) continue;

        // Check for matching braces, parentheses, and strings
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          
          if ((char === '"' || char === "'") && (i === 0 || line[i-1] !== '\\')) {
            if (!inString) {
              inString = true;
              stringChar = char;
            } else if (char === stringChar) {
              inString = false;
            }
          }
          
          if (!inString) {
            if (char === '{') openedBraces++;
            if (char === '}') openedBraces--;
            if (char === '(') openedParens++;
            if (char === ')') openedParens--;
          }
        }

        // Basic validation: check for valid operations
        const isValidLine = isValidJavaLine(trimmedLine);
        if (!isValidLine) {
          throw new Error('Invalid syntax or unsupported operation: ' + trimmedLine);
        }
      }

      if (openedBraces !== 0) {
        throw new Error('Mismatched braces { }');
      }

      if (openedParens !== 0) {
        throw new Error('Mismatched parentheses ( )');
      }

      if (inString) {
        throw new Error('Unterminated string');
      }
    }

    function checkForForbiddenFunctionsInLoops(lines) {
      // No functions are banned from loops with the new cooldown system
      return;
    }

    function isValidJavaLine(line) {
      // Allow comments
      if (line.startsWith('//') || line.startsWith('/*') || line.endsWith('*/')) return true;

      // Allow function calls with semicolon
      const functionCallPattern = /^(moveLeft|moveRight|attack|defend|heal|attackEnemySlotOne|attackEnemySlotTwo|attackEnemySlotThree)\(\);$/;
      if (functionCallPattern.test(line)) return true;

      // Allow System.out.println and System.out.print
      const printPattern = /^System\.out\.print(ln)?\(.*\);$/;
      if (printPattern.test(line)) return true;

      // Allow if statements
      const ifPattern = /^if\s*\(.*\)\s*\{?$/;
      if (ifPattern.test(line)) return true;
      
      // Allow single-line if with statement (like "if (x) continue;")
      const singleLineIfPattern = /^if\s*\(.*\)\s+\w+.*;?$/;
      if (singleLineIfPattern.test(line)) return true;

      // Allow else/else if (including with closing brace before it like "} else if")
      const elsePattern = /^(\}\s*)?else\s*(if\s*\(.*\))?\s*\{?$/;
      if (elsePattern.test(line)) return true;

      // Allow for loops (including enhanced for)
      const forPattern = /^for\s*\(.*\)\s*\{?$/;
      if (forPattern.test(line)) return true;

      // Allow while loops
      const whilePattern = /^while\s*\(.*\)\s*\{?$/;
      if (whilePattern.test(line)) return true;
      
      // Allow do-while loops
      const doPattern = /^do\s*\{?$/;
      if (doPattern.test(line)) return true;
      
      // Allow do-while end
      const doWhileEndPattern = /^\}\s*while\s*\(.*\);$/;
      if (doWhileEndPattern.test(line)) return true;

      // Allow braces (including closing brace before keywords)
      if (line === '{' || line === '}') return true;
      
      // Allow closing brace at start of line (like "} else")
      if (line.startsWith('}')) return true;

      // Allow variable declarations (including arrays)
      const varPattern = /^(int|String|boolean|double|float|long|short|byte|char)((\[\])+)?\s+\w+(\[\])?\s*(=\s*.*)?;?$/;
      if (varPattern.test(line)) return true;

      // Allow simple assignments
      const assignPattern = /^\w+(\[\w+\])?\s*=\s*.+;?$/;
      if (assignPattern.test(line)) return true;

      // Allow compound assignments (+=, -=, *=, /=, %=)
      const compoundPattern = /^\w+\s*(\+=|-=|\*=|\/=|%=)\s*.+;?$/;
      if (compoundPattern.test(line)) return true;

      // Allow increment/decrement operators (++, --)
      const incrementPattern = /^(\+\+\w+|\w+\+\+|--\w+|\w+--)\s*;?$/;
      if (incrementPattern.test(line)) return true;
      
      // Allow break and continue
      if (line === 'break;' || line === 'continue;') return true;
      
      // Allow array initialization
      const arrayInitPattern = /^new\s+(int|String|boolean|double|float)\[.*\];?$/;
      if (arrayInitPattern.test(line)) return true;
      
      // Allow method calls
      const methodCallPattern = /^\w+\(.*\);?$/;
      if (methodCallPattern.test(line)) return true;

      return false;
    }

    async function executeBlock(lines, start, end) {

          console.log('  -> IF completed, next line:', result.nextLine);
          i = result.nextLine;

          i = result.nextLine;

        }

        if (line.startsWith('while') && !line.includes('}')) {
          const result = await executeWhileLoop(lines, i);
          i = result.nextLine;

        if (line.startsWith('do')) {

    async function executeLine(line) {
      console.log('executeLine called with:', line);
      // Remove trailing semicolon and braces
      line = line.replace(/[;{}]/g, '').trim();
      if (!line) {
        console.log('  -> Line is empty after cleanup');
        return;
      }
      
      // Variable declaration with initialization
      const varDeclMatch = line.match(/^(int|String|boolean|double|float|long|short|byte|char)((\[\])+)?\s+(\w+)(\[\])?\s*=\s*(.+)$/);
      if (varDeclMatch) {
        const varName = varDeclMatch[4];
        const isArray = varDeclMatch[2] || varDeclMatch[5];
        const value = evaluateExpression(varDeclMatch[6]);
        console.log(`  Variable declaration: ${varName} = ${value}`);
        setVariable(varName, value, true);
        return;
      }
      
      // Variable declaration without assignment
      const varDeclOnlyMatch = line.match(/^(int|String|boolean|double|float|long|short|byte|char)((\[\])+)?\s+(\w+)(\[\])?$/);
      if (varDeclOnlyMatch) {
        const isArray = varDeclOnlyMatch[2] || varDeclOnlyMatch[5];
        setVariable(varDeclOnlyMatch[4], isArray ? [] : 0, true);
        return;
      }
      
      // Array element assignment
      const arrayAssignMatch = line.match(/^(\w+)\[(.+)\]\s*=\s*(.+)$/);
      if (arrayAssignMatch) {
        const arrName = arrayAssignMatch[1];
        const index = evaluateExpression(arrayAssignMatch[2]);
        const value = evaluateExpression(arrayAssignMatch[3]);
        const arr = getVariable(arrName);
        if (Array.isArray(arr)) {
          arr[index] = value;
        }
        return;
      }
      
      // Increment/decrement
      const incDecMatch = line.match(/^(\+\+|--)(\w+)$|^(\w+)(\+\+|--)$/);
      if (incDecMatch) {
        const varName = incDecMatch[2] || incDecMatch[3];
        const op = incDecMatch[1] || incDecMatch[4];
        const currentVal = getVariable(varName);
        if (currentVal !== undefined) {
          setVariable(varName, currentVal + (op === '++' ? 1 : -1));
        }
        return;
      }
      
      // Compound assignment
      const compoundMatch = line.match(/^(\w+)\s*(\+=|-=|\*=|\/=|%=)\s*(.+)$/);
      if (compoundMatch) {
        const varName = compoundMatch[1];
        const op = compoundMatch[2];
        const value = evaluateExpression(compoundMatch[3]);
        const currentVal = getVariable(varName);
        
        if (currentVal !== undefined) {
          switch(op) {
            case '+=': setVariable(varName, currentVal + value); break;
            case '-=': setVariable(varName, currentVal - value); break;
            case '*=': setVariable(varName, currentVal * value); break;
            case '/=': setVariable(varName, currentVal / value); break;
            case '%=': setVariable(varName, currentVal % value); break;
          }
        }
        return;
      }
      
      // Regular assignment
      const assignMatch = line.match(/^(\w+)\s*=\s*(.+)$/);
      if (assignMatch) {
        const varName = assignMatch[1];
        const value = evaluateExpression(assignMatch[2]);
        setVariable(varName, value);
        return;
      }
      
      // System.out.println and System.out.print
      const printMatch = line.match(/^System\.out\.print(ln)?\((.*)\)$/);
      if (printMatch) {
        const content = printMatch[2].trim();
        const isNewline = printMatch[1] === 'ln';
        console.log('  System.out.print' + (isNewline ? 'ln' : '') + ' content:', content);
        let output = '';
        
        // Handle string concatenation with +
        if (content.includes('+') && content.includes('"')) {
          output = evaluateStringExpression(content);
        } else if (content.startsWith('"') && content.endsWith('"')) {
          output = content.slice(1, -1);
        } else {
          output = evaluateExpression(content);
        }
        
        console.log('  Output:', output);
        consoleLog(output);
        return;
      }
      
      // Function calls
      const funcMatch = line.match(/^(moveLeft|moveRight|attack|defend|heal|attackEnemySlotOne|attackEnemySlotTwo|attackEnemySlotThree|qa1|qa2|qa3|qml|qmr|charge|release|scan|stealth|backstab|gamble|critBoost|barrier|shieldBash|poison|cure)\(\)$|^teleportTo\((\d+)\)$|^combo\((\d+)\)$|^stealth\((\d+)\)$/);
      if (funcMatch) {
        let funcName = funcMatch[1];
        let arg = funcMatch[2] || funcMatch[3] || funcMatch[4];
        
        if (funcMatch[1]) {
          executeGameFunction(funcMatch[1]);
        } else if (funcMatch[2]) {
          funcName = 'teleportTo';
          executeGameFunction('teleportTo', parseInt(funcMatch[2]));
        } else if (funcMatch[3]) {
          funcName = 'combo';
          executeGameFunction('combo', parseInt(funcMatch[3]));
        } else if (funcMatch[4]) {
          funcName = 'stealth';
          executeGameFunction('stealth', parseInt(funcMatch[4]));
        }
        
        // Apply cooldown delay
        const cooldown = COOLDOWNS[funcName] || 500;
        updateGameUI();
        displayConsole();
        await sleep(cooldown);
        return;
      }
    }

    async function executeIfStatement(lines, startIndex) {
      const ifLine = lines[startIndex].trim();
      console.log('executeIfStatement:', ifLine);
      const conditionMatch = ifLine.match(/if\s*\((.+)\)/);
      const condition = evaluateExpression(conditionMatch[1]);
      console.log('  Condition evaluated to:', condition);
      
      // Find the block
      pushScope();
      const blockStart = startIndex + 1;
      let blockEnd = findBlockEnd(lines, startIndex);
      
      if (condition) {
        await executeBlock(lines, blockStart, blockEnd);
        popScope();
        
        // Skip any else/else-if blocks
        let nextLine = blockEnd;
        while (nextLine < lines.length && lines[nextLine].trim().startsWith('else')) {
          nextLine = findBlockEnd(lines, nextLine);
        }
        return { nextLine: nextLine };
      } else {
        popScope();
      }
      
      // Check for else-if and else
      let nextLine = blockEnd;
      while (nextLine < lines.length) {
        const elseLine = lines[nextLine].trim();
        
        if (elseLine.startsWith('else if')) {
          // Handle else-if
          const elseIfCondMatch = elseLine.match(/else\s+if\s*\((.+)\)/);
          const elseIfCond = evaluateExpression(elseIfCondMatch[1]);
          
          pushScope();
          const elseIfBlockStart = nextLine + 1;
          const elseIfBlockEnd = findBlockEnd(lines, nextLine);
          
          if (elseIfCond) {
            await executeBlock(lines, elseIfBlockStart, elseIfBlockEnd);
            popScope();
            
            // Skip remaining else-if/else blocks
            nextLine = elseIfBlockEnd;
            while (nextLine < lines.length && lines[nextLine].trim().startsWith('else')) {
              nextLine = findBlockEnd(lines, nextLine);
            }
            return { nextLine: nextLine };
          } else {
            popScope();
            nextLine = elseIfBlockEnd;
          }
        } else if (elseLine.startsWith('else') && !elseLine.startsWith('else if')) {
          // Handle else
          pushScope();
          const elseBlockStart = nextLine + 1;
          const elseBlockEnd = findBlockEnd(lines, nextLine);
          await executeBlock(lines, elseBlockStart, elseBlockEnd);
          popScope();
          return { nextLine: elseBlockEnd };
        } else {
          break;
        }
      }
      
      return { nextLine: nextLine };
    }

    async function executeForLoop(lines, startIndex) {
      const forLine = lines[startIndex].trim();
      console.log('executeForLoop:', forLine);
      const forMatch = forLine.match(/for\s*\((.+)\)/);
      
      if (forMatch) {
        const parts = forMatch[1].split(';').map(p => p.trim());
        console.log('  For loop parts:', parts);
        if (parts.length === 3) {
          // Create new scope for the loop
          pushScope();
          
          // Init
          await executeLine(parts[0]);
          
          // Find loop block
          const blockStart = startIndex + 1;
          const blockEnd = findBlockEnd(lines, startIndex);
          
          // Execute loop
          let iterations = 0;
          
          while (evaluateExpression(parts[1]) && iterations < MAX_ITERATIONS_PER_LOOP && loopIterationBudget > 0) {
            breakFlag = false;
            continueFlag = false;
            
            loopIterationBudget--;
            await executeBlock(lines, blockStart, blockEnd);
            
            if (breakFlag) {
              breakFlag = false;
              break;
            }
            
            if (continueFlag) {
              continueFlag = false;
            }
            
            await executeLine(parts[2]);
            iterations++;
          }
          
          if (iterations >= MAX_ITERATIONS_PER_LOOP) {
            consoleLog('For loop stopped early: per-loop iteration cap reached (' + MAX_ITERATIONS_PER_LOOP + ').', 'info');
          }
          if (loopIterationBudget <= 0) {
            consoleLog('For loop stopped early: total loop budget exhausted (' + TOTAL_LOOP_BUDGET + ').', 'info');
          }
          
          popScope();
          return { nextLine: blockEnd };
        }
      }
      
      return { nextLine: findBlockEnd(lines, startIndex) };
    }

    async function executeWhileLoop(lines, startIndex) {
      const whileLine = lines[startIndex].trim();
      const conditionMatch = whileLine.match(/while\s*\((.+)\)/);
      
      if (conditionMatch) {
        pushScope();
        const blockStart = startIndex + 1;
        const blockEnd = findBlockEnd(lines, startIndex);
        
        let iterations = 0;
        
        while (evaluateExpression(conditionMatch[1]) && iterations < MAX_ITERATIONS_PER_LOOP && loopIterationBudget > 0) {
          breakFlag = false;
          continueFlag = false;
          
          loopIterationBudget--;
          await executeBlock(lines, blockStart, blockEnd);
          
          if (breakFlag) {
            breakFlag = false;
            break;
          }
          
          if (continueFlag) {
            continueFlag = false;
          }
          
          iterations++;
        }
        
        if (iterations >= MAX_ITERATIONS_PER_LOOP) {
          consoleLog('While loop stopped early: per-loop iteration cap reached (' + MAX_ITERATIONS_PER_LOOP + ').', 'info');
        }
        if (loopIterationBudget <= 0) {
          consoleLog('While loop stopped early: total loop budget exhausted (' + TOTAL_LOOP_BUDGET + ').', 'info');
        }
        
        popScope();
        return { nextLine: blockEnd };
      }
      
      return { nextLine: findBlockEnd(lines, startIndex) };
    }
    
    function executeDoWhileLoop(lines, startIndex) {
      pushScope();
      const blockStart = startIndex + 1;
      let blockEnd = startIndex + 1;
      
      // Find the closing brace and while condition
      let depth = 1;
      let i = blockStart;
      while (i < lines.length && depth > 0) {
        const line = lines[i].trim();
        if (line === '{') depth++;
        if (line === '}' || line.startsWith('}')) {
          depth--;
          if (depth === 0) blockEnd = i;
        }
        i++;
      }
      
      // Find the while condition
      let whileCondLine = blockEnd;
      while (whileCondLine < lines.length) {
        if (lines[whileCondLine].trim().startsWith('}') && lines[whileCondLine].includes('while')) {
          break;
        }
        whileCondLine++;
      }
      
      const condMatch = lines[whileCondLine].match(/while\s*\((.+)\)/);
      
      if (condMatch) {
        let iterations = 0;
        
        do {
          breakFlag = false;
          continueFlag = false;
          
          if (loopIterationBudget <= 0) {
            break;
          }
          loopIterationBudget--;
          executeBlock(lines, blockStart, blockEnd);
          
          if (breakFlag) {
            breakFlag = false;
            break;
          }
          
          if (continueFlag) {
            continueFlag = false;
          }
          
          iterations++;
        } while (evaluateExpression(condMatch[1]) && iterations < MAX_ITERATIONS_PER_LOOP && loopIterationBudget > 0);

        if (iterations >= MAX_ITERATIONS_PER_LOOP) {
          consoleLog('Do-while loop stopped early: per-loop iteration cap reached (' + MAX_ITERATIONS_PER_LOOP + ').', 'info');
        }
        if (loopIterationBudget <= 0) {
          consoleLog('Do-while loop stopped early: total loop budget exhausted (' + TOTAL_LOOP_BUDGET + ').', 'info');
        }
      }
      
      popScope();
      return { nextLine: whileCondLine + 1 };
    }

    function findBlockEnd(lines, startIndex) {
      const startLine = lines[startIndex].trim();
      console.log(`findBlockEnd: startIndex=${startIndex}, line="${startLine}"`);
      let i = startIndex;
      
      // Check if the starting line has an opening brace (e.g., "if (x) {" or just "{")
      if (startLine.includes('{')) {
        console.log('  Has opening brace, finding matching close');
        // Has braces - find matching closing brace
        let depth = 1; // Start at 1 since we found an opening brace
        i++; // Move to next line
        
        while (i < lines.length && depth > 0) {
          const line = lines[i].trim();
          
          // Count all opening braces on this line
          for (let char of line) {
            if (char === '{') depth++;
            if (char === '}') depth--;
            if (depth === 0) break;
          }
          
          i++;
        }
        
        console.log('  Block ends at line:', i);
        return i; // Return line after closing brace
      } else {
        // No braces - single statement
        // The next line should contain the statement
        console.log('  No braces, single statement, returning:', startIndex + 2);
        return startIndex + 2;
      }
    }

    function evaluateExpression(expr) {
      expr = expr.trim();
      
      // String literal
      if (expr.startsWith('"') && expr.endsWith('"')) {
        return expr.slice(1, -1);
      }
      
      // Character literal
      if (expr.startsWith("'") && expr.endsWith("'") && expr.length === 3) {
        return expr.charAt(1);
      }
      
      // Boolean literal
      if (expr === 'true') return true;
      if (expr === 'false') return false;
      
      // Null literal
      if (expr === 'null') return null;
      
      // Array creation
      const arrayNewMatch = expr.match(/new\s+(int|String|boolean|double|float)\[(\d+)\]/);
      if (arrayNewMatch) {
        return new Array(parseInt(arrayNewMatch[2])).fill(0);
      }
      
      // Array literal (e.g., {1, 2, 3})
      if (expr.startsWith('{') && expr.endsWith('}')) {
        const elements = expr.slice(1, -1).split(',').map(e => evaluateExpression(e.trim()));
        return elements;
      }
      
      // Array access
      const arrayAccessMatch = expr.match(/^(\w+)\[(.+)\]$/);
      if (arrayAccessMatch) {
        const arrName = arrayAccessMatch[1];
        const index = evaluateExpression(arrayAccessMatch[2]);
        const arr = getVariable(arrName);
        if (Array.isArray(arr)) {
          return arr[index];
        }
      }
      
      // String concatenation with + (check for quotes to avoid recursion)
      if (expr.includes('+') && expr.includes('"')) {
        return evaluateStringExpression(expr);
      }
      
      // Replace variable names with their values
      let processedExpr = expr;
      
      // Get all variables from all scopes
      const allVars = {};
      for (let scope of variableScopes) {
        Object.assign(allVars, scope);
      }
      
      // Sort variable names by length (longest first) to avoid partial replacements
      const varNames = Object.keys(allVars).sort((a, b) => b.length - a.length);
      
      for (let varName of varNames) {
        const regex = new RegExp('\\b' + varName + '\\b', 'g');
        const value = allVars[varName];
        
        // Replace with proper value representation
        if (typeof value === 'string') {
          processedExpr = processedExpr.replace(regex, '"' + value + '"');
        } else {
          processedExpr = processedExpr.replace(regex, String(value));
        }
      }
      
      // Replace Java operators with JavaScript equivalents
      processedExpr = processedExpr.replace(/&&/g, '&&');
      processedExpr = processedExpr.replace(/\|\|/g, '||');
      
      // Evaluate using JavaScript
      try {
        // Use Function constructor for safer evaluation
        const result = new Function('return ' + processedExpr)();
        return result;
      } catch (e) {
        // If evaluation fails, try returning as-is or 0
        if (!isNaN(processedExpr)) {
          return parseFloat(processedExpr);
        }
        return 0;
      }
    }

    function evaluateStringExpression(expr) {
      // Handle string concatenation: "text" + variable + "more text"
      let result = '';
      let currentToken = '';
      let inString = false;
      let i = 0;
      
      while (i < expr.length) {
        const char = expr[i];
        
        if (char === '"' && (i === 0 || expr[i-1] !== '\\')) {
          if (inString) {
            // End of string literal
            result += currentToken;
            currentToken = '';
            inString = false;
          } else {
            // Start of string literal
            // First evaluate any pending token as variable/expression
            if (currentToken.trim()) {
              const val = evaluateExpression(currentToken.trim());
              result += String(val);
              currentToken = '';
            }
            inString = true;
          }
        } else if (char === '+' && !inString) {
          // Operator outside string - evaluate what we have
          if (currentToken.trim()) {
            const val = evaluateExpression(currentToken.trim());
            result += String(val);
            currentToken = '';
          }
        } else {
          currentToken += char;
        }
        
        i++;
      }
      
      // Handle any remaining token
      if (currentToken.trim()) {
        if (inString) {
          result += currentToken;
        } else {
          const val = evaluateExpression(currentToken.trim());
          result += String(val);
        }
      }
      
      return result;
    }

        if (!saved) return false;
        const equippedLibraries = JSON.parse(saved);
        return equippedLibraries.includes(libraryName);
      } catch (e) {
        return false;
      }
    }
    
    // Sleep helper for cooldowns
    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function performTargetedAttack(targetSlot) {
      if (currentActor === 'player') {
        if (gameState.enemyPosition === targetSlot) {
          if (gameState.enemyStealthed && gameState.enemyStealthInstances > 0) {
            gameState.enemyStealthInstances--;
            consoleLog('Player targets slot ' + targetSlot + ' but enemy is stealthed! Attack avoided. (' + gameState.enemyStealthInstances + ' stealth instances remaining)', 'error');
            if (gameState.enemyStealthInstances === 0) {
              gameState.enemyStealthed = false;
              consoleLog('Enemy stealth expired!', 'info');
            }
          } else {
            let baseDamage = calculateDamage(gameState.complexityScore);
            // Check for crit boost
            let critApplied = false;
            if (gameState.playerCritBoostActive && gameState.playerCritBoostCount > 0) {
              if (Math.random() < 0.5) {
                baseDamage *= 2;
                critApplied = true;
              }
              gameState.playerCritBoostCount--;
              if (gameState.playerCritBoostCount === 0) {
                gameState.playerCritBoostActive = false;
              }
            }
            let damage = gameState.defending ? baseDamage * 0.5 : baseDamage;
            // Apply to barrier first
            if (gameState.enemyBarrier > 0) {
              const barrierDamage = Math.min(gameState.enemyBarrier, damage);
              gameState.enemyBarrier -= barrierDamage;
              damage -= barrierDamage;
              consoleLog('Player targets slot ' + targetSlot + '! Enemy barrier absorbs ' + barrierDamage.toFixed(1) + ' damage. Barrier: ' + gameState.enemyBarrier.toFixed(1), 'info');
            }
            gameState.enemyHP = Math.max(0, gameState.enemyHP - damage);
            consoleLog('Player targets enemy slot ' + targetSlot + '!' + (critApplied ? ' CRITICAL HIT!' : '') + ' Enemy takes ' + damage.toFixed(1) + ' damage. Enemy HP: ' + gameState.enemyHP.toFixed(1), 'info');
          }
        } else {
          consoleLog('Targeted attack missed! Enemy is not in slot ' + targetSlot + '. (Enemy is in E' + gameState.enemyPosition + ')', 'error');
        }
      } else {
        if (gameState.playerPosition === targetSlot) {
          if (gameState.playerStealthed && gameState.playerStealthInstances > 0) {
            gameState.playerStealthInstances--;
            consoleLog('Enemy targets slot ' + targetSlot + ' but player is stealthed! Attack avoided. (' + gameState.playerStealthInstances + ' stealth instances remaining)', 'error');
            if (gameState.playerStealthInstances === 0) {
              gameState.playerStealthed = false;
              consoleLog('Player stealth expired!', 'info');
            }
          } else {
            let baseDamage = calculateDamage(gameState.enemyComplexityScore);
            // Check for crit boost
            let critApplied = false;
            if (gameState.enemyCritBoostActive && gameState.enemyCritBoostCount > 0) {
              if (Math.random() < 0.5) {
                baseDamage *= 2;
                critApplied = true;
              }
              gameState.enemyCritBoostCount--;
              if (gameState.enemyCritBoostCount === 0) {
                gameState.enemyCritBoostActive = false;
              }
            }
            let damage = gameState.enemyDefending ? baseDamage * 0.5 : baseDamage;
            // Apply to barrier first
            if (gameState.playerBarrier > 0) {
              const barrierDamage = Math.min(gameState.playerBarrier, damage);
              gameState.playerBarrier -= barrierDamage;
              damage -= barrierDamage;
              consoleLog('Enemy targets slot ' + targetSlot + '! Player barrier absorbs ' + barrierDamage.toFixed(1) + ' damage. Barrier: ' + gameState.playerBarrier.toFixed(1), 'info');
            }
            gameState.playerHP = Math.max(0, gameState.playerHP - damage);
            consoleLog('Enemy targets player slot ' + targetSlot + '!' + (critApplied ? ' CRITICAL HIT!' : '') + ' Player takes ' + damage.toFixed(1) + ' damage. Player HP: ' + gameState.playerHP.toFixed(1), 'info');
          }
        } else {
          consoleLog('Enemy targeted attack missed! Player is not in slot ' + targetSlot + '. (Player is in P' + gameState.playerPosition + ')', 'error');
        }
      }
    }

    function consoleLog(message, type = 'normal') {
      gameState.console.push({ message: String(message), type: type });
    }

    function displayConsole() {
      const consoleDiv = document.getElementById('consoleContent');
      consoleDiv.innerHTML = '';
      
      gameState.console.forEach(log => {
        const line = document.createElement('div');
        line.className = 'console-line';
        if (log.type === 'error') line.className += ' console-error';
        if (log.type === 'info') line.className += ' console-info';
        line.textContent = log.message;
        consoleDiv.appendChild(line);
      });
      
      // Auto-scroll to bottom
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    function updateGameUI() {
      // Update HP bars
      document.getElementById('playerHPFill').style.width = gameState.playerHP + '%';
      document.getElementById('enemyHPFill').style.width = gameState.enemyHP + '%';
      
      // Update positions
      document.querySelectorAll('#playerPositions .slot').forEach((slot, index) => {
        slot.style.backgroundColor = (index + 1 === gameState.playerPosition) ? '#4dabf7' : '#1a1a1a';
      });
      
      document.querySelectorAll('#enemyPositions .slot').forEach((slot, index) => {
        slot.style.backgroundColor = (index + 1 === gameState.enemyPosition) ? '#ff6b6b' : '#1a1a1a';
      });
    }

    function evaluateJavaCondition(line) {
      // Extract condition from if statement
      const conditionMatch = line.match(/if\s*\((.+)\)/);
      if (!conditionMatch) return true;
      
      const condition = conditionMatch[1].trim();
      // For demo: treat simple comparisons
      try {
        return eval(condition);
      } catch (e) {
        return true; // Default to true if evaluation fails
      }
    }

    function calculateDamage(score) {
      // Damage formula: f(x) = 0.1x^1.3 + 2
      if (score === 0) return 2; // Minimum damage
      return 0.1 * Math.pow(score, 1.3) + 4;
    }

    function calculateHeal(score) {
      // Heal formula: f(x) = 0.05x^1.3 + 2
      if (score === 0) return 2; // Minimum heal
      return 0.05 * Math.pow(score, 1.3) + 2;
    }

    function calculateBarrier(score) {
      // Barrier formula: f(x) = 0.15x^1.3 + 5
      if (score === 0) return 5; // Minimum barrier
      return 0.15 * Math.pow(score, 1.3) + 5;
    }

    // Enemy strategies: a large list of possible code snippets
    const ENEMY_STRATEGIES = [
      // Simple defend then attack
      () => [
        '// Enemy Strategy: Defend then attack',
        'defend();',
        'attack();',
        'System.out.println("Enemy strikes!");'
      ].join('\n'),
      // Target player slot directly
      () => [
        '// Enemy Strategy: Target slot one',
        'attackEnemySlotOne();',
        'System.out.println("Targeting slot 1");'
      ].join('\n'),
      () => [
        '// Enemy Strategy: Target slot two',
        'attackEnemySlotTwo();',
        'System.out.println("Targeting slot 2");'
      ].join('\n'),
      () => [
        '// Enemy Strategy: Target slot three',
        'attackEnemySlotThree();',
        'System.out.println("Targeting slot 3");'
      ].join('\n'),
      // Zigzag movement loop
      () => [
        '// Enemy Strategy: Zigzag movement',
        'int i = 0;',
        'for (i = 0; i < 3; i++) {',
        '  moveLeft();',
        '  moveRight();',
        '}',
        'attack();',
        'System.out.println("Zigzag complete");'
      ].join('\n'),
      // Move toward player then attack targeted slot
      () => {
        const lines = [];
        lines.push('// Enemy Strategy: Move toward player then target');
        if (gameState.enemyPosition < gameState.playerPosition) {
          lines.push('moveRight();');
        } else if (gameState.enemyPosition > gameState.playerPosition) {
          lines.push('moveLeft();');
        } else {
          lines.push('defend();');
        }
        const t = gameState.playerPosition;
        if (t === 1) lines.push('attackEnemySlotOne();');
        else if (t === 2) lines.push('attackEnemySlotTwo();');
        else lines.push('attackEnemySlotThree();');
        lines.push('System.out.println("Advance and strike");');
        return lines.join('\n');
      },
      // Taunt and defend
      () => [
        '// Enemy Strategy: Taunt and defend',
        'System.out.print("Taunting...");',
        'defend();',
        'System.out.println("Ready");'
      ].join('\n'),
      // Double strike pattern
      () => [
        '// Enemy Strategy: Double strike',
        'attack();',
        'attack();',
        'System.out.println("Double hit!");'
      ].join('\n'),
      // Sweep across slots
      () => [
        '// Enemy Strategy: Sweep slots',
        'attackEnemySlotOne();',
        'attackEnemySlotTwo();',
        'attackEnemySlotThree();',
        'System.out.println("Sweep complete");'
      ].join('\n'),
    ];

    function pickRandomEnemyCode() {
      const idx = Math.floor(Math.random() * ENEMY_STRATEGIES.length);
      return ENEMY_STRATEGIES[idx]();
    }

    // Generate a random enemy code snippet each turn
    function generateEnemyCode() {
      return pickRandomEnemyCode();
    }

    function calculateLineScore(line) {
      let score = 0;
      
      // Skip empty lines, comments, and closing braces
      if (!line || line.startsWith('//') || line === '}' || line === '{') return 0;

      // Variable declaration: 2 points (all data types)
      if (/^(int|String|boolean|double|float|long|short|byte|char)(\[\])?\s+\w+/.test(line)) {
        score += 2;
      }
      
      // Array declaration: extra 2 points for array complexity
      if (/\[\]/.test(line) && /^(int|String|boolean|double|float|long|short|byte|char)/.test(line)) {
        score += 2; // Arrays are more complex
      }
      
      // Array initialization with new keyword: 3 points
      if (/new\s+(int|String|boolean|double|float|long|short|byte|char)\[/.test(line)) {
        score += 3;
      }
      
      // Array literal initialization: 2 points
      if (/=\s*\{[^}]+\}/.test(line)) {
        score += 2;
      }
      
      // Array access/assignment: 1 point
      if (/\w+\[\w+\]/.test(line)) {
        score += 1;
      }

      // If statement: 4 points
      if (/^if\s*\(/.test(line)) {
        score += 4;
        // Add points for conditions inside if statement
        const conditions = line.match(/(<|>|<=|>=|==|!=|&&|\|\|)/g);
        if (conditions) score += conditions.length * 1;
      }

      // Else/else if: 3 points
      if (/^else/.test(line)) {
        score += 3;
        // Extra point for else-if (more complex than plain else)
        if (/^else\s+if/.test(line)) {
          score += 1;
        }
      }

      // For loop: 5 points
      if (/^for\s*\(/.test(line)) {
        score += 5;
      }

      // While loop: 5 points
      if (/^while\s*\(/.test(line) && !line.includes('}')) {
        score += 5;
      }
      
      // Do-while loop: 6 points (slightly harder than regular while)
      if (/^do\s*\{?$/.test(line)) {
        score += 6;
      }
      
      // Break/continue: 2 points (control flow manipulation)
      if (/^(break|continue);$/.test(line)) {
        score += 2;
      }

      // Function calls: 3 points each
      if (/(moveLeft|moveRight|attack|defend|heal)\(\)/.test(line)) {
        score += 3;
      }

      // Targeted attack functions: 2 points each (lower score, easier to use)
      if (/(attackEnemySlotOne|attackEnemySlotTwo|attackEnemySlotThree)\(\)/.test(line)) {
        score += 2;
      }
      
      // Library functions: Utility shortcuts (1 point - very easy)
      if (/(qa1|qa2|qa3|qml|qmr)\(\)/.test(line)) {
        score += 1;
      }
      
      // Library functions: Charge mechanics (4 points - strategic)
      if (/(charge|release)\(\)/.test(line)) {
        score += 4;
      }
      
      // Library functions: Teleport (3 points - moderate complexity)
      if (/teleportTo\(\d+\)/.test(line)) {
        score += 3;
      }
      
      // Library functions: Vision (2 points - information gathering)
      if (/scan\(\)/.test(line)) {
        score += 2;
      }
      
      // Library functions: Combo (5 points - high skill requirement)
      if (/combo\(\d+\)/.test(line)) {
        score += 5;
      }
      
      // Library functions: Stealth (4 points - tactical defensive)
      if (/stealth\(\d*\)/.test(line)) {
        score += 4;
      }
      
      // Library functions: Backstab (6 points - high damage conditional)
      if (/backstab\(\)/.test(line)) {
        score += 6;
      }
      
      // Library functions: Fortune (4 points - RNG based)
      if (/(gamble|critBoost)\(\)/.test(line)) {
        score += 4;
      }
      
      // Library functions: Shield (3 points - defensive utility)
      if (/(barrier|shieldBash)\(\)/.test(line)) {
        score += 3;
      }
      
      // Library functions: Poison (4 points - DoT strategy)
      if (/(poison|cure)\(\)/.test(line)) {
        score += 4;
      }

      // Increment/decrement operators (++, --): 1 point
      if (/(\+\+|--)/.test(line)) {
        score += 1;
      }

      // Compound assignment operators (+=, -=, *=, /=, %=): 2 points
      if (/(\+=|-=|\*=|\/=|%=)/.test(line)) {
        score += 2;
      }

      // Regular assignment: 1 point
      if (/^\w+(\[\w+\])?\s*=\s*[^=]/.test(line) && !/(\+=|-=|\*=|\/=|%=)/.test(line)) {
        score += 1;
      }

      // Arithmetic operations (+, -, *, /, %): 1 point each
      const arithmeticOps = line.match(/[+\-*\/%](?![+=])/g);
      if (arithmeticOps) {
        // Don't count compound operators twice
        const validOps = arithmeticOps.filter(op => {
          const index = line.indexOf(op);
          return index === -1 || line[index + 1] !== '=';
        });
        score += validOps.length * 1;
      }

      // System.out.println or System.out.print: 2 points
      if (/System\.out\.print(ln)?/.test(line)) {
        score += 2;
      }
      
      // String concatenation with +: 1 point for complexity
      if (/System\.out\.println.*\+/.test(line) || (/String.*=.*\+/.test(line))) {
        score += 1;
      }

      return score;
    }
  </script>

    </div>

      </div>
      <div id="enemyPositions" class="positions">
        <div class="position slot" id="enemy-slot-1">E1</div>
        <div class="position slot" id="enemy-slot-2">E2</div>
        <div class="position slot" id="enemy-slot-3">E3</div>
      </div>
    </div>
    <div id="playerSection">
      <div id="playerHPContainer">
        <h3>Player HP</h3>
        <div id="playerHPBar" class="hpBar">
          <div id="playerHPFill" class="hpFill"></div>
        </div>
      </div>
      <div id="playerPositions" class="positions">
        <div class="position slot" id="player-slot-1">P1</div>
        <div class="position slot" id="player-slot-2">P2</div>
        <div class="position slot" id="player-slot-3">P3</div>
      </div>
    </div>
  </section>

    <div>
      <h2>Enemy Code</h2>
